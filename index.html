<html lang="pt-BR">

    <title>AquaVibe 🐠</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root { --azul-escuro:#0c4a6e; --azul-medio:#0ea5e9; --azul-claro:#e0f2fe; --verde-aqua:#10b981; --sombra:0 4px 20px rgba(14,165,233,0.15); --dourado:#f59e0b; }

        .marca span { color:var(--verde-aqua); }

        input, select { width:100%; padding:0.9rem 1rem; border:2px solid #e2e8f0; border-radius:12px; font-size:1rem; transition:border 0.3s; }
        input:focus, select:focus { outline:none; border-color:var(--azul-medio); }
        .btn { width:100%; padding:1rem; border:none; border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; transition:transform 0.2s; }
        .btn:active { transform:scale(0.98); }
        .btn-principal { background:linear-gradient(90deg,#0ea5e9,#06b6d4); color:white; margin-top:0.5rem; }
        .btn-secundario { background:transparent; color:var(--azul-medio); margin-top:0.8rem; }
        .btn-perigo { background:#fee2e2; color:#dc2626; margin-top:1rem; }
        .btn-dourado { background:linear-gradient(90deg,#f59e0b,#f97316); color:white; margin-top:0.5rem; }
        .btn-pequeno { padding:0.6rem 1rem; font-size:0.9rem; width:auto; display:inline-block; margin:0.3rem; }
        .link { text-align:center; margin-top:1.2rem; font-size:0.95rem; color:#64748b; }
        .link span { color:var(--azul-medio); font-weight:600; cursor:pointer; }
        .link span:hover { text-decoration:underline; }
        .mensagem { padding:1rem; border-radius:12px; margin:1rem 0; text-align:center; display:none; }
        .mensagem.sucesso { background:#d1fae5; color:#065f46; display:block; }
        .mensagem.erro { background:#fee2e2; color:#991b1b; display:block; }
        .cabecalho-app { background:white; padding:1.2rem; border-radius:0 0 24px 24px; box-shadow:var(--sombra); margin-bottom:1.5rem; }
        .cabecalho-app h2 { color:var(--azul-escuro); font-size:1.4rem; }
        .cabecalho-app p { color:#64748b; margin-top:0.3rem; }
        .selo-admin { display:inline-block; background:linear-gradient(90deg,#f59e0b,#f97316); color:white; padding:0.2rem 0.8rem; border-radius:20px; font-size:0.75rem; font-weight:700; margin-left:0.5rem; }
        .seletor-aquario { margin-top:0.8rem; display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; }
        .tag-aquario { background:var(--azul-claro); padding:0.5rem 1rem; border-radius:20px; font-size:0.9rem; color:var(--azul-escuro); font-weight:500; cursor:pointer; }
        .tag-aquario.ativo { background:var(--azul-medio); color:white; }
        .tag-novo { background:#e0f2fe; border:2px dashed #0ea5e9; }
        .grade { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; max-width:500px; margin:0 auto; }
        .card-funcao { background:white; border-radius:16px; padding:1.5rem; text-align:center; box-shadow:var(--sombra); cursor:pointer; transition:all 0.3s; }
        .card-funcao:hover { transform:translateY(-5px); }
        .card-funcao.admin-card { background:linear-gradient(135deg,#fef3c7,#fed7aa); border:2px solid #f59e0b; }
        .icone { font-size:2rem; margin-bottom:0.5rem; }
        .card-funcao h3 { color:var(--azul-escuro); font-size:1rem; }
        .card-funcao p { color:#94a3b8; font-size:0.8rem; margin-top:0.3rem; }
        .rodape { text-align:center; margin-top:3rem; color:#94a3b8; font-size:0.85rem; }
        .sair { max-width:200px; margin:2rem auto 0; }
        .sub-tela { display:none; padding:1rem 0; }
        .sub-ativa { display:block; }
        .voltar { display:inline-flex; align-items:center; gap:0.5rem; color:var(--azul-medio); cursor:pointer; margin-bottom:1rem; font-weight:500; }
